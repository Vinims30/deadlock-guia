<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="sans-serif">
  <!-- Esquema provisório da tela do jogo. Vai ser trocado por um print de verdade. -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2433"/>
      <stop offset="1" stop-color="#3a2c22"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#ceu)"/>

  <!-- Cenário: prédios e rua -->
  <g fill="#15110e" opacity="0.9">
    <rect x="0" y="260" width="220" height="640"/>
    <rect x="200" y="340" width="180" height="560"/>
    <rect x="1220" y="300" width="200" height="600"/>
    <rect x="1400" y="220" width="200" height="680"/>
  </g>
  <polygon points="380,900 700,470 900,470 1220,900" fill="#2a2119"/>

  <!-- Inimigo com barra de vida -->
  <g transform="translate(1000 410)">
    <rect x="-40" y="-14" width="80" height="9" rx="2" fill="#111"/>
    <rect x="-38" y="-12" width="50" height="5" fill="#d0463b"/>
    <rect x="12" y="-12" width="12" height="5" fill="#7cc6ff"/>
    <text x="0" y="-22" fill="#e8dcc4" font-size="11" text-anchor="middle">&gt;&gt;</text>
    <ellipse cx="0" cy="18" rx="14" ry="16" fill="#5a95e0"/>
    <rect x="-16" y="32" width="32" height="60" rx="10" fill="#5a95e0"/>
  </g>

  <!-- Mira e stamina -->
  <g stroke="#e8dcc4" stroke-width="2">
    <line x1="800" y1="438" x2="800" y2="446"/>
    <line x1="800" y1="454" x2="800" y2="462"/>
    <line x1="788" y1="450" x2="796" y2="450"/>
    <line x1="804" y1="450" x2="812" y2="450"/>
  </g>
  <g fill="#e2bd6a">
    <rect x="776" y="476" width="14" height="4"/>
    <rect x="793" y="476" width="14" height="4"/>
    <rect x="810" y="476" width="14" height="4"/>
  </g>

  <!-- Painéis da interface -->
  <g fill="#0d0b09" fill-opacity="0.82" stroke="#c9a14a" stroke-opacity="0.5">
    <!-- Topo: times e relógio -->
    <rect x="512" y="14" width="576" height="66" rx="8"/>
    <!-- Minimapa -->
    <rect x="24" y="630" width="248" height="248" rx="8"/>
    <!-- Vida -->
    <rect x="352" y="800" width="304" height="56" rx="8"/>
    <!-- Habilidades -->
    <rect x="672" y="768" width="256" height="104" rx="8"/>
    <!-- Itens ativos -->
    <rect x="944" y="792" width="208" height="80" rx="8"/>
    <!-- Souls -->
    <rect x="1184" y="800" width="128" height="64" rx="8"/>
  </g>

  <!-- Detalhes dos painéis -->
  <g>
    <!-- Retratos do seu time e do time inimigo -->
    <g fill="#e08a2c">
      <rect x="524" y="26" width="38" height="42" rx="4"/><rect x="568" y="26" width="38" height="42" rx="4"/>
      <rect x="612" y="26" width="38" height="42" rx="4"/><rect x="656" y="26" width="38" height="42" rx="4"/>
      <rect x="700" y="26" width="38" height="42" rx="4"/><rect x="744" y="26" width="38" height="42" rx="4" opacity="0.35"/>
    </g>
    <g fill="#5a95e0">
      <rect x="818" y="26" width="38" height="42" rx="4"/><rect x="862" y="26" width="38" height="42" rx="4" opacity="0.35"/>
      <rect x="906" y="26" width="38" height="42" rx="4"/><rect x="950" y="26" width="38" height="42" rx="4"/>
      <rect x="994" y="26" width="38" height="42" rx="4"/><rect x="1038" y="26" width="38" height="42" rx="4"/>
    </g>
    <text x="800" y="56" fill="#e8dcc4" font-size="18" text-anchor="middle">12:34</text>

    <!-- Minimapa: lanes -->
    <g fill="none" stroke="#c9a14a" stroke-width="5" opacity="0.7">
      <path d="M60 850 L60 660 L240 660"/>
      <path d="M60 850 L240 660"/>
      <path d="M60 850 L240 850 L240 660"/>
    </g>
    <circle cx="60" cy="850" r="10" fill="#e08a2c"/>
    <circle cx="240" cy="660" r="10" fill="#5a95e0"/>
    <circle cx="150" cy="760" r="6" fill="#e8dcc4"/>

    <!-- Vida -->
    <rect x="368" y="818" width="272" height="20" rx="4" fill="#111"/>
    <rect x="368" y="818" width="200" height="20" rx="4" fill="#5cb85c"/>
    <text x="504" y="833" fill="#0d0b09" font-size="14" text-anchor="middle" font-weight="bold">540 / 750</text>

    <!-- Habilidades -->
    <g fill="#2e2620" stroke="#e2bd6a">
      <rect x="688" y="784" width="52" height="52" rx="6"/>
      <rect x="748" y="784" width="52" height="52" rx="6"/>
      <rect x="808" y="784" width="52" height="52" rx="6"/>
      <rect x="868" y="784" width="52" height="52" rx="6" stroke="#e08a2c" stroke-width="2"/>
    </g>
    <g fill="#e8dcc4" font-size="13" text-anchor="middle">
      <text x="714" y="860">1</text><text x="774" y="860">2</text><text x="834" y="860">3</text><text x="894" y="860">4</text>
    </g>
    <text x="774" y="817" fill="#e8dcc4" font-size="18" text-anchor="middle">8</text>

    <!-- Itens ativos -->
    <g fill="#2e2620" stroke="#a89a82">
      <rect x="956" y="804" width="40" height="40" rx="5"/>
      <rect x="1004" y="804" width="40" height="40" rx="5"/>
      <rect x="1052" y="804" width="40" height="40" rx="5"/>
      <rect x="1100" y="804" width="40" height="40" rx="5"/>
    </g>
    <g fill="#e8dcc4" font-size="12" text-anchor="middle">
      <text x="976" y="862">Z</text><text x="1024" y="862">X</text><text x="1072" y="862">C</text><text x="1120" y="862">V</text>
    </g>

    <!-- Souls -->
    <text x="1248" y="840" fill="#5ad1c4" font-size="22" text-anchor="middle" font-weight="bold">◈ 4.250</text>
  </g>

  <!-- Aviso -->
  <rect x="1300" y="14" width="286" height="34" rx="6" fill="#0d0b09" fill-opacity="0.8"/>
  <text x="1443" y="37" fill="#e2bd6a" font-size="15" text-anchor="middle">Esquema provisório</text>
</svg>
